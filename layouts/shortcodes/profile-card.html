<div class="ballroom-profile">
  {{ with .Get "image" }}
    {{ partial "ballroom/image.html" (dict "page" $.Page "src" . "alt" ($.Get "name") "width" 640 "sizes" "(min-width: 600px) 33vw, 100vw") }}
  {{ end }}
  <div class="ballroom-profile-copy">
    <h3>{{ .Get "name" }}</h3>
    {{ with .Get "affiliation" }}<p class="ballroom-profile-role">{{ . }}</p>{{ end }}
    {{ with .Inner }}<div class="ballroom-profile-bio">{{ . | markdownify }}</div>{{ end }}
  </div>
</div>
