{{- $theme := partial "email/theme.html" . -}}
<style>
  /* Enhancements only: layout, type, spacing, links, and tables are inline. */
  @media only screen and (max-width:620px) {
    .email-shell { padding:12px 8px !important; }
    .email-content { padding:20px 16px !important; }
    .email-title { font-size:26px !important; line-height:32px !important; }
    .email-timetable { font-size:14px !important; line-height:20px !important; }
    .email-timetable th, .email-timetable td { padding:7px 5px !important; }
    .email-overview-cell { display:block !important; width:100% !important; padding:0 0 10px !important; }
  }
  @media (prefers-color-scheme:dark) {
    .email-logo-header { background:{{ $theme.dark.card }} !important; }
    .email-logo-light { display:none !important; max-height:0 !important; overflow:hidden !important; }
    .email-logo-dark { display:block !important; max-height:none !important; overflow:visible !important; }
    .email-bg { background:{{ $theme.dark.background }} !important; }
    .email-card { background:{{ $theme.dark.card }} !important; color:{{ $theme.dark.text }} !important; }
    .email-muted { color:{{ $theme.dark.muted }} !important; }
    .email-heading { color:{{ $theme.dark.heading }} !important; }
    .email-notice { background:{{ $theme.dark.notice }} !important; color:{{ $theme.dark.text }} !important; }
    .email-overview-card { background:{{ $theme.dark.notice }} !important; color:{{ $theme.dark.text }} !important; }
    .email-overview-muted { color:{{ $theme.dark.muted }} !important; }
    .email-timetable th { background:{{ $theme.dark.table_header }} !important; }
    .email-link { color:{{ $theme.dark.link }} !important; }
    .email-button { background:{{ $theme.light.link }} !important; color:#ffffff !important; }
  }
  [data-ogsc] .email-logo-header { background:{{ $theme.dark.card }} !important; }
  [data-ogsc] .email-logo-light { display:none !important; max-height:0 !important; overflow:hidden !important; }
  [data-ogsc] .email-logo-dark { display:block !important; max-height:none !important; overflow:visible !important; }
  [data-ogsc] .email-card { background:{{ $theme.dark.card }} !important; color:{{ $theme.dark.text }} !important; }
  [data-ogsc] .email-muted { color:{{ $theme.dark.muted }} !important; }
  [data-ogsc] .email-heading { color:{{ $theme.dark.heading }} !important; }
  [data-ogsc] .email-link { color:{{ $theme.dark.link }} !important; }
  [data-ogsc] .email-notice { background:{{ $theme.dark.notice }} !important; color:{{ $theme.dark.text }} !important; }
  [data-ogsc] .email-overview-card { background:{{ $theme.dark.notice }} !important; color:{{ $theme.dark.text }} !important; }
  [data-ogsc] .email-overview-muted { color:{{ $theme.dark.muted }} !important; }
  [data-ogsc] .email-timetable th { background:{{ $theme.dark.table_header }} !important; }
</style>
