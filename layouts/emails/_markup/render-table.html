<table class="email-timetable" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:16px 0;font-size:16px;line-height:23px;">
  <thead>{{ range .THead }}<tr>{{ range . }}<th scope="col" style="padding:10px 8px;border:1px solid #dedbd5;background:#f5efee;text-align:left;">{{ .Text }}</th>{{ end }}</tr>{{ end }}</thead>
  <tbody>{{ range .TBody }}<tr>{{ range . }}<td style="padding:10px 8px;border:1px solid #dedbd5;vertical-align:top;">{{ .Text }}</td>{{ end }}</tr>{{ end }}</tbody>
</table>
