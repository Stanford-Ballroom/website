name: Review ballroom cover

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    if: github.head_ref == 'codex/ballroom-cover-20260930'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true
      - run: hugo --minify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser
        run: |
          npm install --prefix "$RUNNER_TEMP/ballroom-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/ballroom-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check cover at phone, tablet, and desktop sizes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >"$RUNNER_TEMP/homepage-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/ballroom-browser/node_modules" node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          (async () => {
            fs.mkdirSync('cover-previews', { recursive: true });
            const browser = await chromium.launch();
            const results = [];
            const failures = [];
            const cases = [320, 375, 390, 768, 1024, 1199, 1200, 1280, 1440, 1920]
              .map(width => ({ width, dark: false }));
            cases.push({ width: 390, dark: true }, { width: 1440, dark: true });
            for (const { width, dark } of cases) {
              const page = await browser.newPage({ viewport: { width, height: 1400 }, deviceScaleFactor: 1 });
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.evaluate(dark => document.documentElement.classList.toggle('dark', dark), dark);
              await page.locator('.ballroom-hero-photo img').evaluate(img => img.decode());
              const metrics = await page.evaluate(() => {
                const image = document.querySelector('.ballroom-hero-photo img');
                const copy = document.querySelector('.ballroom-hero-copy');
                const rect = element => {
                  const { x, y, width, height, bottom, right } = element.getBoundingClientRect();
                  return { x, y, width, height, bottom, right };
                };
                return {
                  viewport: innerWidth, pageWidth: document.documentElement.scrollWidth,
                  image: rect(image), copy: rect(copy),
                  naturalWidth: image.naturalWidth, naturalHeight: image.naturalHeight,
                  src: image.currentSrc, sizes: image.sizes, srcset: image.srcset,
                  headingColor: getComputedStyle(document.querySelector('#home-heading')).color,
                  links: Array.from(copy.querySelectorAll('a'), link => ({ text: link.textContent, ...rect(link) }))
                };
              });
              const name = `${dark ? 'dark' : 'light'}-${width}`;
              await page.screenshot({ path: `cover-previews/${name}.png`,
                clip: { x: 0, y: 0, width, height: Math.ceil(Math.min(metrics.image.bottom + 100, 1400)) } });
              results.push({ name, ...metrics });
              try {
                assert(metrics.pageWidth <= width, `${name}: horizontal overflow`);
                assert(metrics.image.width > 0 && metrics.naturalWidth > 0, `${name}: cover missing`);
                assert(Math.abs(metrics.image.width / metrics.image.height - metrics.naturalWidth / metrics.naturalHeight) < 0.01,
                  `${name}: cover is cropped or stretched`);
                assert(metrics.links.length === 3, `${name}: contact links missing`);
                for (const link of metrics.links) {
                  assert(link.x >= 0 && link.right <= width && link.height >= 44, `${name}: contact link clipped or too small`);
                }
                if (width >= 1200) {
                  assert(metrics.copy.bottom <= metrics.image.y + 0.42 * metrics.image.height,
                    `${name}: copy extends into the dancers`);
                  assert(metrics.headingColor === 'rgb(32, 29, 26)', `${name}: unreadable cover heading`);
                } else {
                  assert(metrics.copy.bottom <= metrics.image.y + 1, `${name}: stacked copy overlaps the image`);
                }
              } catch (error) { failures.push(error.message); }
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('cover-previews/metrics.json', JSON.stringify({ results, failures }, null, 2));
            console.log(JSON.stringify({ widths: cases, failures }, null, 2));
            assert.equal(failures.length, 0, failures.join('\n'));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ballroom-cover-review
          path: cover-previews/
          retention-days: 7
