name: Deploy Hugo Site via SSH rsync

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stanford-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser dependencies
        run: npm ci --ignore-scripts
      - name: Check Figma snapshots match generated emails
        run: |
          for snapshot in design/emails/*.json; do
            [ -f "$snapshot" ] || continue
            python3 scripts/sync_figma_email.py "$snapshot" --check
          done

      - name: Build site
        run: hugo --minify --baseURL="https://ballroom.stanford.edu/"

      - name: Build and validate Outlook copy pages
        run: |
          hugo --environment email --minify \
            --baseURL="https://ballroom.stanford.edu/" \
            --destination "$RUNNER_TEMP/ballroom-email-export"
          python3 scripts/check_emails.py --email-only "$RUNNER_TEMP/ballroom-email-export"
          python3 scripts/build_email_copy.py \
            --email-dir "$RUNNER_TEMP/ballroom-email-export" --site-dir public
          python3 scripts/prepare_outlook.py --source "$RUNNER_TEMP/ballroom-email-export" --destination public

      - name: Upload public dir
        uses: actions/upload-artifact@v4
        with:
          name: public_dir
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download public dir
        uses: actions/download-artifact@v5
        with:
          name: public_dir
          path: public
      - name: Rsync Deployments Action
        uses: Burnett01/rsync-deployments@v8
        with:
          switches: -avzh
          path: ./public/
          remote_path: /home/rohitnem/ballroom.stanford.edu/
          remote_host: "${{ secrets.STANFORD_DOMAINS_SSH_HOST }}"  
          remote_user: "${{ secrets.STANFORD_DOMAINS_SSH_USERNAME }}"
          remote_key: "${{ secrets.STANFORD_DOMAINS_SSH_PRIV_KEY }}"
          remote_key_pass: "${{ secrets.STANFORD_DOMAINS_SSH_PRIV_KEY_PASSPHRASE }}"
      - name: Verify public site
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
            https://ballroom.stanford.edu/ --output /dev/null
          for path in public/emails/*/*.copy.html; do
            [ -f "$path" ] || continue
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
              "https://ballroom.stanford.edu/${path#public/}" --output /dev/null
          done

