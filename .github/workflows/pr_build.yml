name: Check Hugo pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_URL: https://ballroom.stanford.edu/pr-preview-${{ github.event.pull_request.number }}/

concurrency:
  group: hugo-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true
      - name: Build site
        run: hugo --minify
      - name: Build and check email examples (including drafts)
        run: |
          hugo --minify --buildDrafts --destination "${{ runner.temp }}/ballroom-email-check"
          python3 scripts/check_emails.py "${{ runner.temp }}/ballroom-email-check"
      - name: Set up Node for WhatsApp converter tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test WhatsApp conversion and copy view
        env:
          EMAIL_TEST_SITE: ${{ runner.temp }}/ballroom-email-check
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Check script-free email exports
        run: |
          hugo --environment email --minify --buildDrafts --destination "${{ runner.temp }}/ballroom-email-export"
          python3 scripts/check_emails.py --email-only "${{ runner.temp }}/ballroom-email-export"
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          hugo --environment development --minify --buildDrafts --buildFuture \
            --baseURL "$PREVIEW_URL" \
            --destination "$RUNNER_TEMP/ballroom-pr-preview"
          HUGO_BASEURL="$PREVIEW_URL" hugo list all --environment development \
            > "$RUNNER_TEMP/ballroom-pr-pages.csv"
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path
          from urllib.parse import unquote

          root = Path(os.environ["RUNNER_TEMP"]) / "ballroom-pr-preview"
          base = os.environ["PREVIEW_URL"]
          pages = {}
          with (Path(os.environ["RUNNER_TEMP"]) / "ballroom-pr-pages.csv").open() as source:
              for page in csv.DictReader(source):
                  url = page["permalink"]
                  if not url.startswith(base):
                      continue
                  relative = unquote(url[len(base):])
                  target = root / (relative + "index.html" if not relative or relative.endswith("/") else relative)
                  if target.is_file():
                      pages[page["path"]] = {"title": page["title"], "url": url}
          (root / "preview-pages.json").write_text(json.dumps(pages), encoding="utf-8")
          PY
      - name: Upload PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: ballroom-pr-preview
          path: ${{ runner.temp }}/ballroom-pr-preview/
          retention-days: 7
      - name: Upload email drafts for review
        uses: actions/upload-artifact@v4
        with:
          name: ballroom-emails-preview
          path: ${{ runner.temp }}/ballroom-email-check/
          retention-days: 7
      - name: Upload site for review
        uses: actions/upload-artifact@v4
        with:
          name: ballroom-site-preview
          path: public/
          retention-days: 7

  remove-temporary-preview:
    name: Remove temporary SSH preview
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Prepare empty preview directory
        run: mkdir -p preview
      - name: Clear temporary PR preview
        uses: Burnett01/rsync-deployments@v8
        with:
          switches: -avzh --delete
          path: preview/
          remote_path: /home/rohitnem/ballroom.stanford.edu/pr-preview-9/
          remote_host: ${{ secrets.STANFORD_DOMAINS_SSH_HOST }}
          remote_user: ${{ secrets.STANFORD_DOMAINS_SSH_USERNAME }}
          remote_key: ${{ secrets.STANFORD_DOMAINS_SSH_PRIV_KEY }}
          remote_key_pass: ${{ secrets.STANFORD_DOMAINS_SSH_PRIV_KEY_PASSPHRASE }}
