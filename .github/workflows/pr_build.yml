name: Check Hugo pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true
      - name: Build site
        run: hugo --minify
      - name: Upload site for review
        uses: actions/upload-artifact@v4
        with:
          name: ballroom-site-preview
          path: public/
          retention-days: 7
