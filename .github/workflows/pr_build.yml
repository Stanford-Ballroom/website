name: Check Hugo pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_URL: https://ballroom.stanford.edu/pr-preview-${{ github.event.pull_request.number }}/

concurrency:
  group: hugo-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true
      - name: Test email bridge and portability
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check Figma snapshots match generated emails
        run: |
          for snapshot in design/emails/*.json; do
            [ -f "$snapshot" ] || continue
            python3 scripts/sync_figma_email.py "$snapshot" --check
          done
      - name: Build site
        run: hugo --minify
      - name: Build and check email examples (including drafts)
        run: |
          hugo --minify --buildDrafts --destination "${{ runner.temp }}/ballroom-email-check"
          python3 scripts/check_emails.py "${{ runner.temp }}/ballroom-email-check"
      - name: Set up Node for WhatsApp converter tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test WhatsApp conversion and copy view
        env:
          EMAIL_TEST_SITE: ${{ runner.temp }}/ballroom-email-check
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Check script-free email exports
        run: |
          hugo --environment email --minify --buildDrafts --buildFuture --destination "${{ runner.temp }}/ballroom-email-export"
          python3 scripts/check_emails.py --email-only "${{ runner.temp }}/ballroom-email-export"
          python3 scripts/build_email_copy.py --email-dir "${{ runner.temp }}/ballroom-email-export" --site-dir public
          python3 scripts/build_email_copy.py --email-dir "${{ runner.temp }}/ballroom-email-export" --site-dir "${{ runner.temp }}/ballroom-email-check"
      - name: Build PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          hugo --environment development --minify --buildDrafts --buildFuture \
            --baseURL "$PREVIEW_URL" \
            --destination "$RUNNER_TEMP/ballroom-pr-preview"
          python3 scripts/build_email_copy.py \
            --email-dir "$RUNNER_TEMP/ballroom-email-export" \
            --site-dir "$RUNNER_TEMP/ballroom-pr-preview"
          HUGO_BASEURL="$PREVIEW_URL" hugo list all --environment development \
            > "$RUNNER_TEMP/ballroom-pr-pages.csv"
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path
          from urllib.parse import unquote

          root = Path(os.environ["RUNNER_TEMP"]) / "ballroom-pr-preview"
          base = os.environ["PREVIEW_URL"]
          pages = {}
          with (Path(os.environ["RUNNER_TEMP"]) / "ballroom-pr-pages.csv").open() as source:
              for page in csv.DictReader(source):
                  url = page["permalink"]
                  if not url.startswith(base):
                      continue
                  relative = unquote(url[len(base):])
                  target = root / (relative + "index.html" if not relative or relative.endswith("/") else relative)
                  if target.is_file():
                      pages[page["path"]] = {"title": page["title"], "url": url}
                      if target.with_suffix(".copy.html").is_file():
                          pages[page["path"]]["copy_url"] = url.removesuffix(".html") + ".copy.html"
          (root / "preview-pages.json").write_text(json.dumps(pages), encoding="utf-8")
          PY
      - name: Upload PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: ballroom-pr-preview
          path: ${{ runner.temp }}/ballroom-pr-preview/
          retention-days: 7
      - name: Upload email drafts for review
        uses: actions/upload-artifact@v4
        with:
          name: ballroom-emails-preview
          path: ${{ runner.temp }}/ballroom-email-check/
          retention-days: 7
      - name: Upload site for review
        uses: actions/upload-artifact@v4
        with:
          name: ballroom-site-preview
          path: public/
          retention-days: 7

  preview:
    name: Update PR preview
    needs: build
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download PR preview
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v5
        with:
          name: ballroom-pr-preview
          path: preview/
      - name: Prepare preview cleanup
        if: github.event.action == 'closed'
        run: mkdir -p preview
      - name: Sync PR preview
        uses: Burnett01/rsync-deployments@v8
        with:
          switches: -avzh --delete
          path: preview/
          # Only this PR's directory is synchronized, including on cleanup.
          remote_path: /home/rohitnem/ballroom.stanford.edu/pr-preview-${{ github.event.pull_request.number }}/
          remote_host: ${{ secrets.STANFORD_DOMAINS_SSH_HOST }}
          remote_user: ${{ secrets.STANFORD_DOMAINS_SSH_USERNAME }}
          remote_key: ${{ secrets.STANFORD_DOMAINS_SSH_PRIV_KEY }}
          remote_key_pass: ${{ secrets.STANFORD_DOMAINS_SSH_PRIV_KEY_PASSPHRASE }}
      - name: Verify hosted preview
        if: github.event.action != 'closed'
        run: >-
          curl --fail --silent --show-error --location
          --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2
          "$PREVIEW_URL" --output /dev/null
      - name: Update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ballroom-pr-preview -->';
            const pr = context.payload.pull_request;
            const base = process.env.PREVIEW_URL;
            const runURL = process.env.GITHUB_SERVER_URL + '/' +
              process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID;
            let body = marker + '\n### PR preview\n\n';
            if (context.payload.action === 'closed') {
              body += 'Preview removed because this pull request is closed.';
            } else {
              const fs = require('fs');
              const pages = JSON.parse(fs.readFileSync('preview/preview-pages.json', 'utf8'));
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pr.number, per_page: 100
              });
              body += '[Website](' + base + ') · [Email archive](' + base + 'emails/)\n';
              const links = new Set();
              for (const file of files) {
                const page = pages[file.filename];
                if (file.status === 'removed' || !page || !page.url.startsWith(base) || links.has(page.url)) {
                  continue;
                }
                links.add(page.url);
                const title = page.title.replace(/[\[\]\r\n]/g, ' ');
                body += '\n- [' + title + '](<' + page.url + '>)';
                if (page.copy_url?.startsWith(base)) {
                  body += ' · [Copy to Outlook](<' + page.copy_url + '>)';
                }
              }
              body += '\n\nUpdated for ' + pr.head.sha.slice(0, 7) +
                ' · [Workflow run](' + runURL + ').';
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else if (context.payload.action !== 'closed') {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number, body
              });
            }
            await core.summary.addRaw(body).write();

